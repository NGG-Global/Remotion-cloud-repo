<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tiny Tempo — boot ident</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("./fonts/Nunito.ttf") format("truetype");
        font-weight: 200 1000;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a2e28;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        --coral: #cf5134;
        --coral-lit: #e07358;
        --coral-deep: #a33c26;
        --cream: #fff4dc;
        --ink: #243e35;
        --ink-deep: #1a2e28;
        --ink-lit: #435951;
        --ink-shade: #1a2d26;
        --ink-edge: #14221d;
        --ink-rim: #a3aeaa;
        --cream-face: #fff4dc;
        --cream-lit: #fff9e8;
        --cream-shade: #b8b09e;
        --cream-edge: #8c8679;
        --floor: #c9a06a;
        --floor-lit: #d6b384;
        --floor-shade: #91734c;
        --wood-edge: #774c27;
        --wood-lit: #e8a85c;
        --puck: #f6ead0;
        --steel: #8a9a93;
        font-family: "Nunito", sans-serif;
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #field {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 34%,
          var(--coral-lit) 0%,
          var(--coral) 54%,
          var(--coral-deep) 100%
        );
      }

      #graphic {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }

      #lockup {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 0 80px 96px;
        gap: 18px;
        pointer-events: none;
      }

      #wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--ink);
        font-weight: 800;
        font-size: 118px;
        line-height: 0.86;
        letter-spacing: 0.04em;
        text-align: center;
        text-transform: lowercase;
      }

      #word-tiny,
      #word-tempo {
        display: block;
        width: 100%;
      }

      #tagline {
        display: block;
        color: var(--ink);
        font-weight: 700;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.01em;
        text-align: center;
        max-width: 920px;
      }

      #beads {
        display: flex;
        gap: 18px;
        margin-top: 8px;
        align-items: center;
        justify-content: center;
        height: 28px;
      }

      .bead {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #efe3c4;
        border: 3px solid var(--ink-deep);
        box-shadow: 0 3px 0 var(--ink-deep);
        display: block;
      }

      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: multiply;
        opacity: 0.2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-layout-allow-overflow="true"
      >
        <div id="field"></div>

        <svg id="graphic" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">
          <circle id="sun" cx="540" cy="620" r="400" fill="#e07a62" opacity="0.55" />

          <g id="floor">
            <rect x="0" y="1400" width="1080" height="520" fill="#c9a06a" />
            <rect x="0" y="1400" width="1080" height="18" fill="#d6b384" />
            <rect x="0" y="1418" width="1080" height="8" fill="#91734c" />
            <rect x="0" y="1393" width="1080" height="7" fill="#774c27" />
            <ellipse cx="220" cy="1710" rx="46" ry="17" fill="#1a2e28" opacity="0.22" />
            <ellipse cx="220" cy="1706" rx="30" ry="8" fill="#4a3a32" />
            <ellipse cx="430" cy="1818" rx="38" ry="15" fill="#1a2e28" opacity="0.18" />
            <ellipse cx="430" cy="1814" rx="26" ry="7" fill="#4a3a32" />
          </g>

          <g id="peg-anchor">
            <g id="peg-squash">
              <g id="peg-in">
                <ellipse
                  cx="8"
                  cy="14"
                  rx="86"
                  ry="20"
                  fill="none"
                  stroke="#fff4dc"
                  stroke-width="7"
                  opacity="0.6"
                />
                <ellipse cx="4" cy="12" rx="68" ry="15" fill="#1a2e28" opacity="0.18" />
                <rect
                  x="-18"
                  y="-328"
                  width="36"
                  height="332"
                  rx="9"
                  fill="#243e35"
                  stroke="#14221d"
                  stroke-width="7"
                />
                <rect x="-10" y="-316" width="9" height="300" rx="4" fill="#435951" opacity="0.55" />
                <ellipse
                  cx="0"
                  cy="-330"
                  rx="64"
                  ry="22"
                  fill="#243e35"
                  stroke="#14221d"
                  stroke-width="8"
                />
                <ellipse cx="0" cy="-340" rx="64" ry="16" fill="#435951" />
                <ellipse cx="-12" cy="-344" rx="20" ry="6" fill="#a3aeaa" opacity="0.45" />
              </g>
            </g>
          </g>

          <g id="mallet-enter">
            <g id="mallet-spin">
              <g transform="scale(1.18) translate(-52 -102)">
                <rect x="90" y="90" width="310" height="52" rx="18" fill="#1a2e28" opacity="0.18" />
                <rect
                  x="2"
                  y="64"
                  width="108"
                  height="76"
                  rx="24"
                  fill="#1a2d26"
                  stroke="#14221d"
                  stroke-width="7"
                />
                <rect x="2" y="64" width="108" height="26" rx="24" fill="#435951" />
                <rect x="2" y="88" width="108" height="52" rx="22" fill="#243e35" />
                <rect x="16" y="74" width="58" height="11" rx="5" fill="#a3aeaa" opacity="0.42" />

                <rect
                  x="86"
                  y="74"
                  width="300"
                  height="56"
                  rx="9"
                  fill="#b8b09e"
                  stroke="#8c8679"
                  stroke-width="6"
                />
                <rect x="86" y="74" width="300" height="34" rx="9" fill="#fff4dc" />
                <rect x="108" y="80" width="256" height="11" rx="5" fill="#fff9e8" opacity="0.92" />

                <path
                  d="M320 54 L376 42 L388 86 L352 98 L322 90 Z"
                  fill="#243e35"
                  stroke="#14221d"
                  stroke-width="7"
                  stroke-linejoin="round"
                />
                <rect
                  x="352"
                  y="40"
                  width="158"
                  height="132"
                  rx="13"
                  fill="#243e35"
                  stroke="#14221d"
                  stroke-width="8"
                />
                <rect x="352" y="40" width="158" height="28" rx="13" fill="#435951" />
                <rect x="362" y="48" width="126" height="7" rx="3" fill="#a3aeaa" opacity="0.55" />
                <rect x="356" y="136" width="150" height="32" rx="8" fill="#1a2d26" />
                <rect x="356" y="152" width="150" height="18" rx="6" fill="#8a9a93" />
                <rect x="352" y="164" width="158" height="10" rx="4" fill="#14221d" />
                <circle cx="464" cy="90" r="8" fill="#fff4dc" />
                <circle cx="464" cy="90" r="3.8" fill="#b8b09e" />
              </g>
            </g>
          </g>

          <g id="impact" opacity="0">
            <g transform="translate(700 1072) scale(2.1)">
              <line
                x1="-48"
                y1="-10"
                x2="-72"
                y2="-28"
                stroke="#fff4dc"
                stroke-width="5"
                stroke-linecap="round"
              />
              <line
                x1="48"
                y1="-10"
                x2="72"
                y2="-28"
                stroke="#fff4dc"
                stroke-width="5"
                stroke-linecap="round"
              />
              <line
                x1="-20"
                y1="-36"
                x2="-28"
                y2="-58"
                stroke="#fff4dc"
                stroke-width="4"
                stroke-linecap="round"
              />
              <line
                x1="20"
                y1="-36"
                x2="28"
                y2="-58"
                stroke="#fff4dc"
                stroke-width="4"
                stroke-linecap="round"
              />
              <ellipse
                cx="0"
                cy="6"
                rx="48"
                ry="16"
                fill="none"
                stroke="#fff4dc"
                stroke-width="3"
              />
            </g>
          </g>

          <g id="chips">
            <g class="chip" id="chip-0">
              <rect x="-17" y="-4.5" width="34" height="9" rx="3" fill="#fff4dc" />
            </g>
            <g class="chip" id="chip-1">
              <rect x="-19" y="-4" width="38" height="8" rx="3" fill="#f6ead0" />
            </g>
            <g class="chip" id="chip-2">
              <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#fff4dc" />
            </g>
            <g class="chip" id="chip-3">
              <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#e8a85c" />
            </g>
            <g class="chip" id="chip-4">
              <rect x="-10" y="-3.5" width="20" height="7" rx="3" fill="#efe6c8" />
            </g>
          </g>
        </svg>

        <svg id="grain" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">
          <defs>
            <filter id="tt-grain-overlay" x="0" y="0" width="100%" height="100%">
              <feTurbulence
                type="fractalNoise"
                baseFrequency="0.85"
                numOctaves="4"
                seed="7"
                stitchTiles="stitch"
              />
              <feColorMatrix type="saturate" values="0" />
            </filter>
            <pattern id="tt-dots-overlay" width="18" height="18" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="3" r="1.1" fill="#243e35" opacity="0.22" />
              <circle cx="11" cy="10" r="0.9" fill="#243e35" opacity="0.16" />
              <circle cx="16" cy="4" r="0.7" fill="#243e35" opacity="0.12" />
            </pattern>
          </defs>
          <rect width="1080" height="1920" filter="url(#tt-grain-overlay)" />
          <rect width="1080" height="1920" fill="url(#tt-dots-overlay)" opacity="0.45" />
        </svg>

        <div id="lockup">
          <div id="wordmark">
            <div id="word-tiny">tiny</div>
            <div id="word-tempo">tempo</div>
          </div>
          <div id="tagline">The rhythm of everyday life.</div>
          <div id="beads" aria-hidden="true">
            <span class="bead" id="bead-0"></span>
            <span class="bead" id="bead-1"></span>
            <span class="bead" id="bead-2"></span>
            <span class="bead" id="bead-3"></span>
          </div>
        </div>
      </section>

      <audio
        id="boot-music"
        src="tiny-tempo.mp3"
        data-start="0"
        data-duration="5"
        data-media-start="0.167"
        data-volume="0.78"
        data-track-index="10"
      ></audio>
    </div>

    <script>
      const HIT = 1.5;
      const PEG_X = 700;
      const FLOOR_Y = 1400;
      const PIVOT_X = 293.5;
      const PIVOT_Y = 867.08;
      const WINDUP = -36;
      const CONTACT = 16;
      const CHIP_ORIGIN = { x: 724, y: 1078 };
      const CHIPS = [
        { a: -0.35, d: 78, rot: 28 },
        { a: 0.55, d: 92, rot: -18 },
        { a: -1.15, d: 64, rot: 48 },
        { a: 0.2, d: 108, rot: 12 },
        { a: 1.05, d: 70, rot: -40 },
      ];

      const build = () => {
        const tl = gsap.timeline({ paused: true });

        gsap.set("#field", { opacity: 0 });
        gsap.set("#sun", { scale: 0.78, transformOrigin: "540px 620px", opacity: 0.22 });
        gsap.set("#floor", { y: 140, opacity: 0 });
        gsap.set("#peg-anchor", { x: PEG_X, y: FLOOR_Y });
        gsap.set("#peg-squash", { transformOrigin: "0px 0px", scaleY: 1 });
        gsap.set("#peg-in", { y: 110, scale: 0.62, transformOrigin: "0px 0px", opacity: 0 });
        gsap.set("#mallet-spin", {
          x: PIVOT_X,
          y: PIVOT_Y,
          rotation: WINDUP,
          transformOrigin: "0px 0px",
        });
        gsap.set("#mallet-enter", { x: -420, y: -140, rotation: -24, opacity: 0 });
        gsap.set("#graphic", { scale: 1, transformOrigin: "52% 42%", x: 0, y: 0 });
        gsap.set("#impact", { opacity: 0, scale: 0.6, transformOrigin: "700px 1072px" });
        gsap.set(".chip", { opacity: 0, x: CHIP_ORIGIN.x, y: CHIP_ORIGIN.y, rotation: 0 });
        gsap.set("#word-tiny", { opacity: 0, y: 56, scale: 0.84, transformOrigin: "50% 100%" });
        gsap.set("#word-tempo", { opacity: 0, y: 56, scale: 0.84, transformOrigin: "50% 100%" });
        gsap.set("#tagline", { opacity: 0, y: 18 });
        gsap.set("#beads", { opacity: 0, y: 12 });
        gsap.set(".bead", { scale: 1, transformOrigin: "50% 50%" });

        tl.to("#field", { opacity: 1, duration: 0.42, ease: "power2.out" }, 0);
        tl.to(
          "#sun",
          { scale: 1, opacity: 0.55, duration: 0.9, ease: "power3.out" },
          0.04,
        );
        tl.to("#floor", { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.1);
        tl.to(
          "#peg-in",
          { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
          0.26,
        );
        tl.to(
          "#mallet-enter",
          { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
          0.68,
        );

        tl.to("#mallet-spin", { rotation: WINDUP - 10, duration: 0.18, ease: "sine.out" }, 1.02);
        tl.to("#mallet-spin", { rotation: CONTACT, duration: 0.3, ease: "power4.in" }, 1.2);

        tl.to("#peg-squash", { scaleY: 0.94, duration: 0.08, ease: "power2.out" }, HIT);
        tl.to("#peg-squash", { scaleY: 1, duration: 0.22, ease: "power2.out" }, HIT + 0.08);

        tl.to("#graphic", { scale: 1.05, x: 8, y: 3, duration: 0.08, ease: "power2.out" }, HIT);
        tl.to(
          "#graphic",
          { scale: 1.015, x: 0, y: 0, duration: 0.36, ease: "power3.out" },
          HIT + 0.08,
        );
        tl.to("#graphic", { scale: 1.055, duration: 3.02, ease: "sine.inOut" }, HIT + 0.48);

        tl.fromTo(
          "#impact",
          { opacity: 0, scale: 0.55 },
          { opacity: 1, scale: 1, duration: 0.08, ease: "power2.out" },
          HIT,
        );
        tl.to("#impact", { opacity: 0, scale: 1.35, duration: 0.16, ease: "power2.out" }, HIT + 0.08);

        CHIPS.forEach((chip, i) => {
          const pEnd = 1;
          const dist = chip.d * (0.2 + pEnd * 1.15);
          const x = CHIP_ORIGIN.x + Math.cos(chip.a) * dist;
          const y = CHIP_ORIGIN.y + Math.sin(chip.a) * dist * 0.62 - 28;
          tl.fromTo(
            `#chip-${i}`,
            { opacity: 0, x: CHIP_ORIGIN.x, y: CHIP_ORIGIN.y, rotation: chip.rot },
            {
              opacity: 1,
              x,
              y,
              rotation: chip.rot + 55,
              duration: 0.34,
              ease: "power2.out",
            },
            HIT,
          );
          tl.to(`#chip-${i}`, { opacity: 0, duration: 0.14, ease: "power1.in" }, HIT + 0.34);
        });

        tl.to("#mallet-spin", { rotation: CONTACT + 0.5, duration: 0.18, ease: "power2.out" }, HIT);
        tl.to("#mallet-spin", { rotation: CONTACT, duration: 0.28, ease: "power2.out" }, HIT + 0.18);
        tl.to(
          "#mallet-spin",
          {
            rotation: CONTACT + 0.55,
            duration: 1.45,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
          },
          HIT + 0.5,
        );

        tl.to(
          "#word-tiny",
          { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" },
          1.78,
        );
        tl.to(
          "#word-tempo",
          { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" },
          1.86,
        );
        tl.to("#tagline", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.22);
        tl.to("#beads", { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 2.55);

        const beads = ["#bead-0", "#bead-1", "#bead-2", "#bead-3"];
        beads.forEach((sel, i) => {
          const start = 2.55 + i * 0.5;
          tl.to(
            sel,
            {
              scale: 1.22,
              backgroundColor: "#cf5134",
              duration: 0.22,
              ease: "sine.out",
              yoyo: true,
              repeat: 1,
            },
            start,
          );
          if (start + 2 < 4.85) {
            tl.to(
              sel,
              {
                scale: 1.22,
                backgroundColor: "#cf5134",
                duration: 0.22,
                ease: "sine.out",
                yoyo: true,
                repeat: 1,
              },
              start + 2,
            );
          }
        });

        tl.to(
          "#sun",
          { scale: 1.04, duration: 3.2, ease: "sine.inOut" },
          HIT,
        );

        window.__timelines["main"] = tl;
      };

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(build);
      } else {
        build();
      }
    </script>
  </body>
</html>
