<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"product","type":"string","label":"Product","default":"HyperFrames"},
    {"id":"accent","type":"color","label":"Accent","default":"#3CE6AC"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames Showreel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: Inter;
        src: url("assets/fonts/Inter-latin-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      [data-composition-id="showreel"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
