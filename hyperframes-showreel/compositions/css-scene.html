<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS / 3D card</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Inter;
          src: url("assets/fonts/Inter-latin-variable.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
          color: #fafafa;
          perspective: 1400px;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #0a0a0a;
        }
        .copy {
          position: absolute;
          top: 120px;
          left: 100px;
        }
        .kicker {
          font-size: 18px;
          font-weight: 600;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #3ce6ac;
        }
        h2 {
          margin: 14px 0 0;
          font-size: 56px;
          font-weight: 800;
        }
        #css-card {
          position: absolute;
          left: 560px;
          top: 360px;
          width: 800px;
          height: 420px;
          border-radius: 28px;
          background: linear-gradient(160deg, #18181b, #0a0a0a);
          border: 1px solid rgba(60, 230, 172, 0.35);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 42px;
          font-weight: 800;
        }
      </style>
      <div id="root" data-composition-id="css-scene" data-width="1920" data-height="1080">
        <div class="fill"></div>
        <div class="copy">
          <div class="kicker">rotationY · clipPath · GSAP clock</div>
          <h2>CSS vocabulary. HyperFrames time.</h2>
        </div>
        <div id="css-card">rotateY + clip-path</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#css-card",
          { rotationY: -70, opacity: 0 },
          { rotationY: 0, opacity: 1, duration: 1.2, ease: "power3.out" },
          0.2,
        );
        tl.fromTo(
          "#css-card",
          { clipPath: "inset(40% 40% 40% 40% round 28px)" },
          { clipPath: "inset(0% 0% 0% 0% round 28px)", duration: 0.9, ease: "power2.out", immediateRender: false },
          0.35,
        );
        tl.to(
          "#css-card",
          { rotationY: 16, duration: 3.6, yoyo: true, repeat: 1, ease: "sine.inOut" },
          2.2,
        );
        window.__timelines["css-scene"] = tl;
      </script>
    </template>
  </body>
</html>
