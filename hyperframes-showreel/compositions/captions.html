<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Captions</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: Inter;
          src: url("assets/fonts/Inter-latin-variable.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
          color: #fafafa;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #0a0a0a;
        }
        .stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
        }
        .kicker {
          font-size: 18px;
          font-weight: 600;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #3ce6ac;
        }
        .words {
          display: flex;
          gap: 18px;
          flex-wrap: wrap;
          justify-content: center;
          max-width: 1500px;
        }
        .word {
          font-size: 72px;
          font-weight: 800;
          letter-spacing: -0.04em;
          padding: 8px 18px;
          border-radius: 14px;
          background: #18181b;
        }
      </style>
      <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
        <div class="fill"></div>
        <div class="stage">
          <div class="kicker">kinetic captions · word-by-word</div>
          <div class="words">
            <span id="cap-w0" class="word">Captions</span>
            <span id="cap-w1" class="word">are</span>
            <span id="cap-w2" class="word">just</span>
            <span id="cap-w3" class="word">timed</span>
            <span id="cap-w4" class="word">HTML.</span>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        ["#cap-w0", "#cap-w1", "#cap-w2", "#cap-w3", "#cap-w4"].forEach((sel, i) => {
          tl.fromTo(sel, { y: 40, opacity: 0, scale: 0.86 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.25 + i * 0.18);
        });
        tl.to("#cap-w4", { backgroundColor: "#3ce6ac", color: "#0a0a0a", duration: 0.35 }, 1.5);
        window.__timelines["captions"] = tl;
      </script>
    </template>
  </body>
</html>
